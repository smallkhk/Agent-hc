<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#07090c">
  <title>Live View</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { background: #000; }
    .bar { position: fixed; inset: 0 0 auto; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 12px 16px;
      background: linear-gradient(rgb(0 0 0 / 0.75), transparent); }
    .bar .spacer { flex: 1; }
    #room { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
    #stats { color: var(--muted); font-size: 0.85rem; }
    .view { position: fixed; inset: 0; display: grid; place-items: center; }
    .view-frame { position: relative; width: 100%; height: 100%; }
    #feed { width: 100%; height: 100%; object-fit: contain; }
    .view-frame .brackets { inset: 16px; --b: 28px; --t: 3px; }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/admin.html"><span class="brand-mark"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></span><span class="brand-name" data-brand-name>HANDCAM</span></a>
    <span id="room"></span>
    <span class="spacer"></span>
    <span id="stats" class="num"></span>
    <span id="state" class="chip">Connecting…</span>
  </header>
  <main class="view">
    <div class="view-frame">
      <video id="feed" autoplay muted playsinline></video>
      <div class="brackets"><i></i><i></i><i></i><i></i></div>
    </div>
  </main>
  <script src="/vendor/livekit-client.umd.js"></script>
  <script src="brand.js"></script>
  <script src="watch.js"></script>
</body>
</html>
