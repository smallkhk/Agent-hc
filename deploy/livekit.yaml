# LiveKit server config. API keys come from LIVEKIT_KEYS (see docker-compose.yml).
port: 7880                # signalling (behind Nginx at lk.example.com)
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881          # ICE/TCP fallback for players on restrictive networks
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
redis:
  address: 127.0.0.1:6379
room:
  empty_timeout: 300
  max_participants: 4     # player cam + worker + a few admin viewers
logging:
  level: info
