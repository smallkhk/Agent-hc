# Only for a self-hosted LiveKit server (docker compose --profile selfhosted).
# Not needed with LiveKit Cloud. Certificates: certbot --nginx -d lk.example.com
# Also open UDP 50000-60000 and TCP 7881 in the firewall, and set LIVEKIT_URL=wss://lk.example.com,
# LIVEKIT_INTERNAL_URL=ws://127.0.0.1:7880.

server {
  listen 80;
  listen [::]:80;
  server_name lk.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# LiveKit signalling (WebSocket). Media goes direct over UDP 50000-60000 / TCP 7881.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name lk.example.com;

  ssl_certificate     /etc/letsencrypt/live/lk.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lk.example.com/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 24h;   # sessions run for hours
    proxy_send_timeout 24h;
  }
}
