# Nginx reverse proxy for the app (website, API, dashboard, Socket.IO).
# Certificates: certbot --nginx -d handcam.example.com
# Video goes through LiveKit Cloud; only for a self-hosted LiveKit add livekit-selfhosted.conf.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name handcam.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# App: Express API, Socket.IO, static /web pages
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name handcam.example.com;

  ssl_certificate     /etc/letsencrypt/live/handcam.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/handcam.example.com/privkey.pem;

  client_max_body_size 10m;

  # Worker-only endpoints: reachable on 127.0.0.1, never from outside.
  location /internal/ { return 404; }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
}
