# Redis (always). Run from /deploy: docker compose --env-file ../.env up -d
# Video goes through LiveKit Cloud by default. To run your own LiveKit server instead:
#   docker compose --env-file ../.env --profile selfhosted up -d   (and see nginx/livekit-selfhosted.conf)
# Host networking so a self-hosted LiveKit can use the UDP media port range directly.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--appendonly", "yes"]
    network_mode: host
    volumes:
      - redis-data:/data
    restart: unless-stopped

  livekit:
    profiles: ["selfhosted"]
    image: livekit/livekit-server:v1.13
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    environment:
      # "key: secret" — read from .env, never committed
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
